name: Destroy

# Manual teardown of the live stack so a demo never keeps billing. The bootstrap
# stack (state bucket, registry, OIDC role) is left in place.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "<1.16.0"

      - name: Terraform destroy
        working-directory: infra/live
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform destroy -auto-approve -var "image_tag=unused"
